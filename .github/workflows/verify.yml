name: Backend and Android verification

on:
  push:
    paths:
      - 'packages/**'
      - 'clients/android/**'
      - '.github/workflows/verify.yml'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'packages/**'
      - 'clients/android/**'
      - '.github/workflows/verify.yml'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.12.2
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm --filter @jizhang/shared build
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit tests, Android package and lint
        working-directory: clients/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
      - name: Upload APK and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Android-verification-${{ github.run_number }}
          path: |
            clients/android/app/build/outputs/apk/debug/*.apk
            clients/android/app/build/reports/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build actual production image
        run: docker build -t jizhang-verification .
      - name: Exercise isolated container lifecycle and complete backup
        run: bash packages/server/scripts/check-multiuser-container.sh
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install isolated image-service test dependencies
        run: |
          python3 -m venv .venv-cutout
          .venv-cutout/bin/python -m pip install -r packages/cutout/requirements-test.txt
      - name: Verify image formats, private jobs and lifecycle with a synthetic engine
        working-directory: packages/cutout
        run: ../../.venv-cutout/bin/python -m pytest tests -q
